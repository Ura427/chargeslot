name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chargeslot
          POSTGRES_PASSWORD: chargeslot
          POSTGRES_DB: chargeslot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargeslot -d chargeslot" --health-interval 2s --health-timeout 5s --health-retries 15

    env:
      DATABASE_URL: postgresql://chargeslot:chargeslot@localhost:5432/chargeslot

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate -w api
      - run: npm test
      - run: npm run build
        # Builds and runs the real images through Docker Compose. The `ci` job above can't
        # catch image-only bugs: it never builds the images and never starts the compiled app.
        # A separate job because the `ci` job's Postgres service already holds port 5432.
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: bash scripts/docker-smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
