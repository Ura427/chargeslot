services:
  db:
    image: postgres:18-alpine
    environment:
      # Local development only.
      POSTGRES_USER: chargeslot
      POSTGRES_PASSWORD: chargeslot
      POSTGRES_DB: chargeslot
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chargeslot -d chargeslot']
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: api/.env
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: postgresql://chargeslot:chargeslot@db:5432/chargeslot
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: build
    command: sh -c "npm run db:migrate -w api && npm run db:seed -w api"
    environment:
      DATABASE_URL: postgresql://chargeslot:chargeslot@db:5432/chargeslot
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
