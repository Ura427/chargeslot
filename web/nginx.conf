server {
  listen 80;
  root /usr/share/nginx/html;

  # Vite fingerprints asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: client-side routes like /stations/123 don't exist as files.
  # Without this, refreshing on any route other than / returns 404.
  location / {
    try_files $uri /index.html;
  }
}
